remote_translation_prompt: |
  <task>Translate</task>
  <goal>Translating user generated content for a website.</goal>
  <instructions>You are given an input_text to translate from and an output_locale to translate to. Detect the language of the input_text and translate it from the original language to the output_locale, ensuring that the translation is accurate and natural. Preserve the original meaning and context.</instructions>
  <input_text>%{input_text}</input_text>
  <output_locale>%{output_locale}</output_locale>
  <output>Reply ONLY with the translated text.</output>
image_suggestion_prompt: |
  <task>Produce an image search query</task>
  <goal>A short and concise image search query, for finding best suited images for the input text</goal>
  <instructions>Analyze given title and description of a resource, translate sentences to english, extract the meaningful concepts and produce a search query string in english language.</instructions>
  <title>%{title}</title>
  <description>%{description}</description>
  <output>Reply ONLY with a single string.</output>
proposal_feedback_prompt: |
  <task>Give feedback on a proposal</task>
  <goal>Helping a citizen improve their proposal before submitting it to a citizen participation website.</goal>
  <instructions>You are given the title, summary, description and tags of a proposal, and a list of criteria. Evaluate the proposal against each of the criteria. For every criterion the proposal does not fully meet, briefly explain why and suggest a concrete improvement. Be concise, constructive and respectful. Do not rewrite the whole proposal. Write the feedback in the output_locale.</instructions>
  <criteria>%{criteria}</criteria>
  <title>%{title}</title>
  <summary>%{summary}</summary>
  <description>%{description}</description>
  <tags>%{tags}</tags>
  <output_locale>%{output_locale}</output_locale>
  <output>Reply ONLY with the feedback, formatted as Markdown.</output>
